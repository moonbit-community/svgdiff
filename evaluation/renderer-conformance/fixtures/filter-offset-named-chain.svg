<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <defs>
    <filter id="shift" x="-100%" y="-100%" width="400%" height="400%">
      <feOffset dx="2" result="right"/>
      <feOffset in="right" dy="3" result="down"/>
      <feOffset in="down" dx="-1"/>
    </filter>
  </defs>
  <rect id="box" x="3" y="2" width="5" height="4" fill="#20a040" filter="url(#shift)"/>
</svg>
