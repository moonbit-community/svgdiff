<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <defs>
    <mask id="fade" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="10" height="16" fill="white" fill-opacity="0.5"/>
    </mask>
  </defs>
  <g mask="url(#fade)">
    <rect x="1" y="2" width="10" height="12" fill="red"/>
    <rect x="5" y="2" width="10" height="12" fill="blue"/>
  </g>
</svg>
