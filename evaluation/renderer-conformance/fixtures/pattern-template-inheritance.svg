<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <pattern id="base" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="4" height="8" fill="#e33"/>
    </pattern>
    <pattern id="tile" href="#base" patternTransform="translate(2 0)"/>
  </defs>
  <rect x="2" y="2" width="12" height="12" fill="url(#tile)"/>
</svg>
