name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: svgdiff-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            expected_arch: X64
            executable: svgdiff
          - platform: windows-x64
            runner: windows-2025
            expected_arch: X64
            executable: svgdiff.exe
          - platform: macos-arm64
            runner: macos-15
            expected_arch: ARM64
            executable: svgdiff

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MoonBit on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify release identity
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          sh scripts/check-release-tag.sh "$GITHUB_REF_NAME"
          moon version --all

      - name: Test native release candidate
        shell: bash
        run: |
          moon check --target native --warn-list +73
          moon test --target native
          sh scripts/test-cli.sh
          sh scripts/test-agent-projection.sh
          sh scripts/test-versioning.sh
          sh scripts/test-release-bundle.sh

      - name: Package native release archive
        shell: bash
        run: |
          sh scripts/package-release.sh --archive
          version=$(awk -F '"' '$1 ~ /^version = / { print $2; exit }' moon.mod)
          bundle="dist/svgdiff-$version-${{ matrix.platform }}"
          archive="$bundle.tar.gz"
          test -f "$archive"
          test -f "$bundle/${{ matrix.executable }}"
          test "$(jq -r '.source.dirty' "$bundle/provenance.json")" = false
          test "$(jq -r '.source.revision' "$bundle/provenance.json")" = "$GITHUB_SHA"
          (
            cd "$bundle"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c SHA256SUMS
            else
              sha256sum -c SHA256SUMS
            fi
          )
          mkdir -p _release/determinism
          cp "$archive" _release/
          python evaluation/determinism/validate.py \
            --cli "$bundle/${{ matrix.executable }}" \
            --output _release/determinism-results.json \
            --bundle _release/determinism

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: svgdiff-release-${{ matrix.platform }}
          path: _release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          pattern: svgdiff-release-*
          path: _release/platforms

      - name: Validate tagged source
        shell: bash
        run: |
          moon info
          moon fmt
          git diff --exit-code
          moon check --target all --warn-list +73
          moon test --target all
          sh scripts/test-cli.sh
          sh scripts/test-wasm.sh
          sh scripts/test-agent-projection.sh
          sh scripts/test-versioning.sh
          sh scripts/test-module-package.sh
          sh scripts/test-schema-examples.sh
          sh scripts/test-compatibility.sh
          sh scripts/test-cross-platform-determinism.sh
          sh scripts/test-fuzz-smoke.sh
          sh scripts/test-benchmark.sh
          sh scripts/test-stage-benchmarks.sh
          sh scripts/test-performance-budgets.sh

      - name: Gate release assets
        shell: bash
        run: |
          sh scripts/check-release-tag.sh "$GITHUB_REF_NAME"
          python evaluation/determinism/compare_platforms.py \
            --platform linux-x64=_release/platforms/svgdiff-release-linux-x64/determinism \
            --platform windows-x64=_release/platforms/svgdiff-release-windows-x64/determinism \
            --platform macos-arm64=_release/platforms/svgdiff-release-macos-arm64/determinism \
            --output _release/cross-platform-determinism.json

          version=$(awk -F '"' '$1 ~ /^version = / { print $2; exit }' moon.mod)
          mkdir -p _release/publish
          for platform in linux-x64 windows-x64 macos-arm64; do
            source="_release/platforms/svgdiff-release-$platform/svgdiff-$version-$platform.tar.gz"
            test -f "$source"
            cp "$source" _release/publish/
          done
          test "$(find _release/publish -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 3
          (
            cd _release/publish
            sha256sum svgdiff-*.tar.gz >SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Retain publishable assets
        uses: actions/upload-artifact@v4
        with:
          name: svgdiff-release-assets-${{ github.ref_name }}
          path: _release/publish
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf 'Release %s already exists; refusing to replace its assets\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "svgdiff $GITHUB_REF_NAME" \
            --generate-notes \
            _release/publish/*
