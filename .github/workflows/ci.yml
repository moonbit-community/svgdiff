name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svgdiff-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Check generated files and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
      - run: moon check --target all --warn-list +73
      - run: moon test --target all
      - run: sh scripts/test-cli.sh
      - run: sh scripts/test-wasm.sh
      - run: sh scripts/test-module-package.sh
