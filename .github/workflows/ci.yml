name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svgdiff-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Update MoonBit registry
        run: moon update

      - name: Verify generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Check all library targets
        run: moon check --target all --warn-list +73

      - name: Run MoonBit tests
        run: moon test --target all

      - name: Validate WebAssembly entry
        run: sh scripts/test-wasm.sh

      - name: Install Chromium for browser validation
        run: npx --yes --package "@playwright/cli@0.1.17" playwright-cli install-browser chromium --with-deps

      - name: Validate GitHub Pages browser product
        run: sh scripts/test-pages.sh

      - name: Validate CLI and version identity
        run: |
          sh scripts/test-cli.sh
          sh scripts/test-agent-projection.sh
          sh scripts/test-versioning.sh

      - name: Validate MoonBit publication package
        run: sh scripts/test-module-package.sh

      - name: Validate Schema and compatibility
        run: |
          sh scripts/test-schema-examples.sh
          sh scripts/test-compatibility.sh

      - name: Validate determinism bundle aggregation
        run: sh scripts/test-cross-platform-determinism.sh

      - name: Run fixed-seed fuzz smoke
        run: sh scripts/test-fuzz-smoke.sh

      - name: Validate curated corpus and hidden annotations
        run: |
          sh scripts/test-corpus.sh
          sh scripts/test-annotations.sh
          sh scripts/test-alignment-annotations.sh
          sh scripts/test-region-annotations.sh
          sh scripts/test-cause-annotations.sh

      - name: Validate QA-only structural diagnostics
        run: sh scripts/test-ssim-diagnostics.sh

      - name: Validate query-conditioned semantic concern policy
        run: sh scripts/test-semantic-concern-policy.sh

      - name: Run benchmark sanity gate
        run: sh scripts/test-benchmark.sh

      - name: Run pipeline stage benchmark sanity
        run: sh scripts/test-stage-benchmarks.sh

      - name: Enforce representative performance budgets
        run: sh scripts/test-performance-budgets.sh

  determinism-bundle:
    name: Determinism bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            expected_arch: X64
          - platform: windows-x64
            runner: windows-2025
            expected_arch: X64
          - platform: macos-arm64
            runner: macos-15
            expected_arch: ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up MoonBit on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify runner identity
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: python -c "import os; actual = os.environ['RUNNER_ARCH']; expected = os.environ['EXPECTED_ARCH']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Record toolchain
        run: moon version --all

      - name: Update MoonBit registry
        run: moon update

      - name: Capture canonical report bundle
        run: |
          moon build --target native --release modules/svgdiff/cmd/svgdiff
          python evaluation/determinism/validate.py --cli _build/native/release/build/Milky2018/svgdiff/cmd/svgdiff/svgdiff.exe --output _artifacts/determinism-results.json --bundle _artifacts/bundle

      - name: Upload canonical report bundle
        uses: actions/upload-artifact@v4
        with:
          name: svgdiff-determinism-${{ matrix.platform }}
          path: _artifacts/bundle
          if-no-files-found: error
          retention-days: 1

  cross-platform-determinism:
    name: Compare cross-platform determinism bundles
    needs: determinism-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: svgdiff-determinism-*
          path: _artifacts/platforms

      - name: Compare canonical report bytes
        run: |
          python evaluation/determinism/compare_platforms.py \
            --platform linux-x64=_artifacts/platforms/svgdiff-determinism-linux-x64 \
            --platform windows-x64=_artifacts/platforms/svgdiff-determinism-windows-x64 \
            --platform macos-arm64=_artifacts/platforms/svgdiff-determinism-macos-arm64 \
            --output _artifacts/cross-platform-determinism.json
